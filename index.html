<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ✅ BharatMile Favicon — multi-format for Google & all browsers -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="theme-color" content="#c1644a" />
    <meta name="msapplication-TileImage" content="/favicon-192.png" />
    <meta name="msapplication-TileColor" content="#c1644a" />

    <!-- Mobile Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ✅ Google Fonts — preconnect first, then non-blocking stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap"
      />
    </noscript>

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- ✅ SEO Title -->
    <title>Ranthambore Safari & Jaipur Tours | Family Packages | BharatMile</title>

    <!-- ✅ SEO Description -->
    <meta
      name="description"
      content="Book safe, family-friendly Ranthambore tiger safaris and romantic Jaipur tours with BharatMile. Custom packages starting at ₹4,999. Chat on WhatsApp today!"
    />

    <!-- ✅ Canonical URL -->
    <link rel="canonical" href="https://bharatmile.com/" />

    <!-- ✅ Open Graph -->
    <meta property="og:title" content="Ranthambore Safari & Jaipur Tours | Family Packages | BharatMile" />
    <meta property="og:description" content="Book safe, family-friendly Ranthambore tiger safaris and romantic Jaipur tours with BharatMile. Custom packages starting at ₹4,999. Chat on WhatsApp today!" />
    <meta property="og:image" content="https://bharatmile.com/preview.jpg" />
    <meta property="og:url" content="https://bharatmile.com/" />
    <meta property="og:type" content="website" />

    <!-- ✅ Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- 🔥 Preload LCP Hero Image — matches HeroBannerImagel.webp used in Home.jsx -->
    <link
      rel="preload"
      as="image"
      href="/src/assets/HeroBannerImagel.webp"
      fetchpriority="high"
      type="image/webp"
    />

    <!-- CSS handled by Vite bundle — no manual preload needed -->

    <!-- 🟢 Google Analytics — deferred until AFTER page is fully interactive -->
    <!-- GTM was blocking 193ms of main thread. Now loads after 8s or first idle, whichever is later -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      function loadGTM() {
        const s = document.createElement('script');
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-30H4H9PKXX';
        s.async = true;
        s.defer = true;
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', 'G-30H4H9PKXX', { send_page_view: true });
      }

      // Load GTM only after:
      // 1. Page is fully loaded (load event)
      // 2. AND at least 5 seconds have passed (protects LCP + TBT)
      // This removes GTM from the critical rendering path entirely
      if (document.readyState === 'complete') {
        setTimeout(loadGTM, 5000);
      } else {
        window.addEventListener('load', function() {
          setTimeout(loadGTM, 5000);
        }, { once: true });
      }
    </script>

    <!-- ✅ Schema Markup -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "BharatMile",
      "image": "https://bharatmile.com/favicon-512.png",
      "url": "https://bharatmile.com",
      "telephone": "+91-XXXXXXXXXX",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Jaipur",
        "addressRegion": "Rajasthan",
        "addressCountry": "IN"
      },
      "priceRange": "₹₹",
      "audience": {
        "@type": "Audience",
        "audienceType": "Families and Couples"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <!-- Main bundle -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
