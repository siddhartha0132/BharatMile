<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ✅ BharatMile Favicon — replaces default Vite icon -->
    <link rel="icon" type="image/jpeg" href="/favicon.jpeg" />
    <link rel="apple-touch-icon" href="/favicon.jpeg" />
    <meta name="theme-color" content="#c1644a" />

    <!-- Mobile Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ✅ Google Fonts — preconnect first, then non-blocking stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap"
      />
    </noscript>

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- ✅ SEO Title -->
    <title>Ranthambore Safari & Jaipur Tours | Family Packages | BharatMile</title>

    <!-- ✅ SEO Description -->
    <meta
      name="description"
      content="Book safe, family-friendly Ranthambore tiger safaris and romantic Jaipur tours with BharatMile. Custom packages starting at ₹4,999. Chat on WhatsApp today!"
    />

    <!-- ✅ Canonical URL -->
    <link rel="canonical" href="https://bharatmile.com/" />

    <!-- ✅ Open Graph -->
    <meta property="og:title" content="Ranthambore Safari & Jaipur Tours | Family Packages | BharatMile" />
    <meta property="og:description" content="Book safe, family-friendly Ranthambore tiger safaris and romantic Jaipur tours with BharatMile. Custom packages starting at ₹4,999. Chat on WhatsApp today!" />
    <meta property="og:image" content="https://bharatmile.com/preview.jpg" />
    <meta property="og:url" content="https://bharatmile.com/" />
    <meta property="og:type" content="website" />

    <!-- ✅ Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- 🔥 Preload LCP Hero Image — matches the actual src used in Home.jsx -->
    <link
      rel="preload"
      as="image"
      href="/src/assets/jaipur.jpeg"
      fetchpriority="high"
      type="image/jpeg"
    />

    <!-- CSS handled by Vite bundle — no manual preload needed -->

    <!-- 🟢 Google Analytics without forced reflow -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      requestIdleCallback(() => {
        const s = document.createElement('script');
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-30H4H9PKXX';
        s.async = true;
        document.head.appendChild(s);

        gtag('js', new Date());
        gtag('config', 'G-30H4H9PKXX');
      });
    </script>

    <!-- ✅ Schema Markup -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "BharatMile",
      "image": "https://bharatmile.com/logo.jpg",
      "url": "https://bharatmile.com",
      "telephone": "+91-XXXXXXXXXX",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Jaipur",
        "addressRegion": "Rajasthan",
        "addressCountry": "IN"
      },
      "priceRange": "₹₹",
      "audience": {
        "@type": "Audience",
        "audienceType": "Families and Couples"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <!-- Main bundle -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
